# Provider definitions for code-less providers - NO custom plugin code needed.
#
# These providers are served entirely by omniagent's BUILT-IN provider
# implementation (chat_completions / anthropic support), so they do not ship
# as plugin files. They used to live as bare plugin.json manifests baked into
# the omniagent image (plugins/providers/*); their definitions now live here.
#
# Load them into an OMNI_DIR via the dashboard's Models Import flow (fetch
# this file's `providers` section, diff against local config/models.yml,
# merge), or copy the entries into your stack's config/models.yml.
#
# Schema - same as omni-stack config/models.yml (task "Provider/model
# overrides via config/models.yml", task_18cd408ead8bcbbd):
#   plugin: false                       # no plugin - builtin provider support
#   api_mode: "chat_completions" | "anthropic"   # "dynamic" is LEGACY - do not use
#   api_key: "$secret:NAME" / "$env:VAR"        # NEVER a literal value
#   models / model_config / default_base_url / default_model / refresh_url /
#   supports_reasoning per the models.yml spec.

providers:
  # DeepSeek API provider - OpenAI-compatible chat completions.
  # LIVE model list (GET https://api.deepseek.com/v1/models, verified
  # 2026-09-16): ONLY `deepseek-flash` and `deepseek-v4-pro` exist.
  # `deepseek-flash` IS "v4.1 flash"; the API REJECTS `deepseek-v4-flash`,
  # `deepseek-v3` and `deepseek-r1` ("supported API model names are
  # deepseek-flash, deepseek-v4-pro"), so they must not be offered here.
  deepseek:
    plugin: false
    api_mode: "chat_completions"
    supports_reasoning: true
    default_base_url: "https://api.deepseek.com/v1"
    refresh_url: "https://api.deepseek.com/v1/models"
    default_model: "deepseek-flash"
    api_key: "$secret:DEEPSEEK_API_KEY"
    models: ["deepseek-flash", "deepseek-v4-pro"]

  # OpenAI API provider - OpenAI-compatible chat completions.
  openai:
    plugin: false
    api_mode: "chat_completions"
    default_base_url: "https://api.openai.com/v1"
    refresh_url: "https://api.openai.com/v1/models"
    default_model: "gpt-4o"
    api_key: "$secret:OPENAI_API_KEY"
    models: ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo", "gpt-4.1"]

  # OpenCode Go - gateway provider with multi-model support. Serves an
  # OpenAI-compatible /v1/chat/completions surface for GLM/Kimi/DeepSeek and an
  # Anthropic-compatible /v1/messages surface for MiniMax/Qwen; the model list
  # is refreshable via refresh_url. api_mode is "chat_completions" (the legacy
  # "dynamic" mode from the old plugin.json is NOT carried over); use
  # model_config.<model>.api_mode: "anthropic" for models served on the
  # Anthropic surface.
  opencode-go:
    plugin: false
    api_mode: "chat_completions"
    supports_reasoning: true
    default_base_url: "https://opencode.ai/zen/go/v1"
    refresh_url: "https://opencode.ai/zen/go/v1/models"
    default_model: "deepseek-v4-flash"
    api_key: "$secret:OPENCODE_API_KEY"
    # Custom request headers (typed values, resolved by core at request time):
    # x-opencode-session carries the current channel name so OpenCode Go can
    # attribute and optimize traffic per session. The core client always sends
    # a User-Agent identifying omniagent on top of this. REQUIRED: this
    # `headers: x-opencode-session: {type: channel}` block must stay - without
    # it the gateway cannot attribute traffic per session. `fallback` keeps the
    # header present on paths that have no channel in scope (global non-thread
    # client, /api/llm/chat without a channel): OpenCode Go answers a request
    # without this header with 400 MissingSessionID.
    headers:
      x-opencode-session:
        type: channel
        fallback: omniagent
    # Live model list (GET https://opencode.ai/zen/go/v1/models, verified
    # 2026-09-16; refreshable via refresh_url).
    models: ["minimax-m3", "minimax-m2.7", "minimax-m2.5", "kimi-k3", "kimi-k2.7-code", "kimi-k2.6", "longcat-2.0", "kimi-k2.5", "glm-5.2", "glm-5.3-flash", "glm-5.3", "glm-5.1", "glm-5", "deepseek-v4-pro", "deepseek-v4-flash", "deepseek-flash", "deepseek-v4.1-flash", "deepseek-v4-flash-vision-exp", "qwen3.7-max", "qwen3.8-max", "qwen3.8-flash", "qwen3.7-plus", "qwen3.6-plus", "qwen3.5-plus", "mimo-v2-pro", "mimo-v2-omni", "mimo-v2.5-pro", "mimo-v2.5", "hy4-preview", "hy3", "union-alpha", "hy3-preview", "gpt-5.6-luna", "grok-4.5", "grok-4.6", "muse-spark-1.3-contributor", "muse-spark-1.2-contributor", "omen-alpha"]

  # Test provider - built-in fake responses without HTTP calls or API keys.
  # default_base_url points at the noop-provider container server
  # (omni-stack services/noop), which is separate from any plugin file.
  #
  # Consistency with providers/: `providers/noop` is a bare manifest (no
  # entrypoint/code) kept ONLY so the deploy test harness can install it via
  # install-git; this plugin-less definition is the authoritative code-less
  # provider and is what serves requests when no plugin is installed/enabled
  # (both definitions declare the same base_url/api_mode/model list).
  # `providers/noop-full` is NOT code-less (real stdio client.py) and therefore
  # intentionally has NO entry here.
  noop:
    plugin: false
    api_mode: "chat_completions"
    default_base_url: "http://noop-provider:9090/v1"
    default_model: "test-model-1"
    models: ["test-model-1", "test-model-2"]
